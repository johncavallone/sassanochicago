title: Sassano Chicago
description: >-
  A genealogy resource documenting the Sassanesi — Italian immigrants from Sassano,
  Italy — who settled on Federal Street in Chicago from 1893 to 1959. Family trees,
  death certificates, marriage records, and the history of Chicago's forgotten
  Italian enclave in Grand Boulevard / Bronzeville.
url: "https://www.sassanochicago.org"
lang: en_US
author: John A. Cavallone
markdown: kramdown

